version: 2
updates:
  # Compat bounds in the package Project.toml (replaces CompatHelper).
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The Turing stack moves together: a bump of one usually needs the others,
      # so they arrive as one PR whose CI tests the combination.
      turing-ecosystem:
        patterns:
          - "Turing"
          - "DynamicPPL"
          - "AbstractMCMC"
          - "AbstractPPL"
          - "FlexiChains"
          - "MCMCChains"
    ignore:
      # Turing 0.49 (latest as of 2026-11) only loads FlexiChains <= 0.6, and
      # MCMCChains 8 needs FlexiChains 0.7. Remove these two entries when a
      # Turing release supports FlexiChains 0.7.
      - dependency-name: "FlexiChains"
        versions: [">= 0.7"]
      - dependency-name: "MCMCChains"
        versions: [">= 8"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
